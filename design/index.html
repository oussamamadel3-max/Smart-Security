case 'alerts':return head('التنبيهات الإدارية','تنبيهات مستقلة عن إشعارات الحوادث الموجهة للمالك.')+`<div class="panel"><div class="timeline"><div class="event"><div class="event-icon">⚠</div><div><strong>جهاز غير متصل — المستودع</strong><p>فقد الاتصال وفق مهلة النبضة المعتمدة.</p></div><time>اليوم، 09:12</time></div><div class="event"><div class="event-icon">⚑</div><div><strong>حدث فقد سجل محلي</strong><p>وصلت علامة فقد من الجهاز أثناء استعادة الاتصال.</p></div><time>اليوم، 08:10</time></div></div></div>`;
case 'login':return owner('login');default:return admin('dashboard')}}
function mobile(page){let original=page==='notifications'?'notifications':page;let view;if(page==='notifications'){view=`<div class="panel"><h3>إذن الإشعارات</h3><p class="subtitle">فعّل الإشعارات للحصول على تنبيهات الحوادث. يمكن متابعة السجلات حتى عند رفض الإذن.</p><div class="notice info">هذا نموذج للطلب السياقي. تفعيل الزر يغيّر واجهة العرض فقط ولا يطلب إذن الهاتف الحقيقي.</div><button class="btn" id="enableNotifications">${state.notificationsEnabled?'تم تفعيل العرض التجريبي':'تفعيل إشعارات تجريبية'}</button></div>`}else if(page==='profile'){view=`<div class="panel"><h3>إعدادات الحساب</h3><div class="kv"><div><label>الحساب</label><strong>أحمد محمود</strong></div><div><label>الإشعارات</label><strong>${state.notificationsEnabled?'مفعّلة تجريبياً':'غير مفعّلة'}</strong></div></div><button class="btn danger" style="margin-top:14px" data-demo="تمت محاكاة تسجيل الخروج فقط؛ يجب إبطال رمز FCM في التطبيق الفعلي.">تسجيل الخروج</button></div>`}else{view=owner(original);view=view.replace(/^<div class="page-head">[\s\S]*?<\/div><\/div>/,'')};let labels={'dashboard':'الرئيسية','devices':'أجهزتي','detail':'تفاصيل الجهاز','events':'الحوادث','eventDetail':'تفاصيل الحادثة','commands':'الأوامر','commandDetail':'تفاصيل الأمر','notifications':'الإشعارات','profile':'الإعدادات'};return head('تطبيق الهاتف','معاينة متجاوبة لشاشات المالك على Android وiOS.')+`<div class="mobile-tabs">${mobileMenu.map(([id,label])=>`<button class="${id===page?'active':''}" data-mobile="${id}">${label}</button>`).join('')}</div><div class="phone-scene"><div class="phone"><div class="phone-notch"></div><div class="phone-inner"><div class="phone-head"><div><small style="color:#90a0b2">حصن | الأمان الذكي</small><h2>${labels[page]||'الرئيسية'}</h2></div><div class="avatar">أ</div></div>${view}<div class="phone-bottom"><button class="${page==='dashboard'?'active':''}" data-mobile="dashboard">⌂<br>الرئيسية</button><button class="${page==='devices'?'active':''}" data-mobile="devices">▣<br>الأجهزة</button><button class="${page==='events'?'active':''}" data-mobile="events">♧<br>الأحداث</button><button class="${page==='profile'?'active':''}" data-mobile="profile">♙<br>حسابي</button></div></div></div></div>`}
function modal(){if(!state.modal)return '';let names={link:'ربط الجهاز',transfer:'تأكيد نقل الملكية',unlink:'تأكيد إلغاء الربط',disable:'تعطيل الحساب'};return `<div class="modal-wrap" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${names[state.modal]}"><h2>${names[state.modal]}</h2><p>هذه معاينة لتصميم نافذة التأكيد. لا يتم حفظ أي تعديل حقيقي في قاعدة البيانات.</p><div class="notice">في النظام الفعلي يجب التحقق من الصلاحية وتنفيذ العملية على الخادم وتوثيق نتيجتها.</div><div class="modal-foot"><button class="btn ${['unlink','disable'].includes(state.modal)?'danger':''}" id="modalConfirm">تأكيد تجريبي</button><button class="btn outline" id="modalCancel">إلغاء</button></div></div></div>`}
function render(){let menu=state.mode==='admin'?adminMenu:state.mode==='mobile'?mobileMenu:ownerMenu;let page=state.mode==='mobile'?state.mobilePage:state.page;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">♜</div><div><strong>حِصن</strong><small>نظام الأمان الذكي</small></div></div><div class="side-label">${state.mode==='admin'?'إدارة النظام':state.mode==='mobile'?'شاشات الهاتف':'لوحة المالك'}</div><nav class="nav">${menu.map(([id,label])=>`<button class="${id===page?'active':''}" data-${state.mode==='mobile'?'mobile':'go'}="${id}"><span class="ico">${icons[id]||'○'}</span><span>${label}</span></button>`).join('')}</nav><div class="sidebar-footer"><span class="tiny-dot"></span> نموذج تفاعلي للتصميم<br><span style="color:#799bb7">بيانات تجريبية — بلا API أو MQTT</span></div></aside><main class="main"><header class="topbar"><div class="crumb">الرئيسية / <b>${menu.find(i=>i[0]===page)?.[1]||''}</b></div><div class="top-actions"><div class="role-switch"><button class="${state.mode==='owner'?'on':''}" data-mode="owner">المالك</button><button class="${state.mode==='admin'?'on':''}" data-mode="admin">الإدارة</button><button class="${state.mode==='mobile'?'on':''}" data-mode="mobile">الهاتف</button></div><button class="iconbtn" data-${state.mode==='mobile'?'mobile':'go'}="notifications" title="الإشعارات">♧</button><div class="avatar">${state.mode==='admin'?'م':'أ'}</div></div></header><section class="content">${state.mode==='admin'?admin(page):state.mode==='mobile'?mobile(page):owner(page)}<div class="footer-note">حِصن · نموذج تصميم UX/UI تجريبي · جميع البيانات والأوامر المعروضة لأغراض المعاينة فقط</div></section></main></div>${modal()}`;}
let toastTimeout;function toast(msg){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.remove(),3600)}
document.addEventListener('click',e=>{let el=e.target.closest('button,[data-device]');if(!el)return;if(el.dataset.mode){state.mode=el.dataset.mode;state.page='dashboard';state.mobilePage='dashboard';state.query='';state.commandPending=false;render();return}if(el.dataset.mobile){state.mobilePage=el.dataset.mobile;state.query='';render();return}if(el.dataset.go){state.page=el.dataset.go;state.query='';render();return}if(el.dataset.device){state.selected=el.dataset.device;if(state.mode==='mobile')state.mobilePage='detail';else state.page=state.mode==='admin'?'adminDeviceDetail':'detail';render();return}if(el.dataset.command){state.commandPending=true;state.pendingType=el.dataset.command;state.commandStatus='PENDING';render();toast('تم إنشاء أمر تجريبي بحالة PENDING — بانتظار ACK');return}if(el.id==='confirmAck'){state.commandPending=false;state.commandStatus='EXECUTED';if(state.pendingType==='ARM')selected().armed=true;if(state.pendingType==='DISARM')selected().armed=false;if(state.pendingType==='MUTE_ALARM')state.muted=true;render();toast('محاكاة تأكيد التنفيذ: EXECUTED');return}if(el.id==='timeoutAck'){state.commandPending=false;state.commandStatus='TIMED_OUT';render();toast('انتهت المهلة؛ الحالة المؤكدة لم تتغير');return}if(el.dataset.modal){state.modal=el.dataset.modal;render();return}if(el.id==='modalCancel'){state.modal=null;render();return}if(el.id==='modalConfirm'){state.modal=null;render();toast('أُغلقت نافذة التأكيد التجريبية — لم تُحفظ تغييرات فعلية');return}if(el.id==='enableNotifications'){state.notificationsEnabled=!state.notificationsEnabled;render();toast('تغيّر العرض التجريبي لإذن الإشعارات');return}if(el.dataset.demo){toast(el.dataset.demo);return}});document.addEventListener('input',e=>{if(e.target.id==='searchBox'){state.query=e.target.value;let parent=e.target.closest('.panel');let body=parent?.querySelector('tbody');if(!body)return;let p=state.page;let rows=p==='events'?evRows():p==='commands'?cmdRows():null;if(rows!==null)body.innerHTML=rows||'<tr><td colspan="6">لا توجد نتائج مطابقة.</td></tr>';else{let rowsArray=Array.from(body.querySelectorAll('tr'));rowsArray.forEach(r=>r.style.display=r.textContent.includes(state.query)?'':'none')}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}if(e.key==='Enter'&&e.target.matches('[data-device]'))e.target.click()});render();
</script></body></html>
