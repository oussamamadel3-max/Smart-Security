# OPS-T-01 — local Mosquitto (eclipse-mosquitto:2 / 2.1.2)
# Isolated local integration only. Production MQTT remains disabled.
# Listeners are intended for host bind 127.0.0.1 via Compose ports.

persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plaintext local listener (dev convenience; still password+ACL)
listener 1883
protocol mqtt

# TLS local listener (test CA mounted from ops/tls/server)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
