# OPS-T-03 — staging-like LOCAL stack (127.0.0.1 only).
# Separate project/volumes from OPS-T-01. Does NOT enable production MQTT/Outbox/FCM.
# Do not publish to a public VPS with this file without a separate owner authorization.

name: smartsecurity_stg

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: smartsecurity-stg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esp32_security_staging}
      POSTGRES_USER: ${POSTGRES_USER:-ss_stg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - smartsecurity_stg_pgdata:/var/lib/postgresql/data
    networks:
      - smartsecurity_stg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: ops/staging/Dockerfile.api
    image: smartsecurity-api:${DEPLOY_IMAGE_TAG:-local-stg}
    container_name: smartsecurity-stg-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-esp32_security_staging};Username=${POSTGRES_USER:-ss_stg};Password=${POSTGRES_PASSWORD}
      Auth__Jwt__Issuer: ${Auth__Jwt__Issuer:-esp32-security-staging}
      Auth__Jwt__Audience: ${Auth__Jwt__Audience:-esp32-security-clients-staging}
      Auth__Jwt__SigningKey: ${Auth__Jwt__SigningKey:?Set Auth__Jwt__SigningKey in .env.staging}
      Auth__Cors__AllowedOrigins__0: ${Auth__Cors__AllowedOrigins__0:-https://localhost:8443}
      Auth__Cookie__Name: ${Auth__Cookie__Name:-esp32_rt_stg}
      Auth__Cookie__Path: ${Auth__Cookie__Path:-/api/auth}
      Auth__Cookie__SameSite: ${Auth__Cookie__SameSite:-None}
      Auth__CsrfCookieName: ${Auth__CsrfCookieName:-esp32_csrf_stg}
      Auth__CsrfHeaderName: ${Auth__CsrfHeaderName:-X-CSRF-TOKEN}
      Mqtt__Inbound__Enabled: "false"
      Mqtt__Outbound__LivePublishEnabled: "false"
      Mqtt__Outbox__Enabled: "false"
      Fcm__Enabled: "false"
      Fcm__Provider: Fake
      # Trust Docker-private proxy hops only. Kestrel is NOT published to the host
      # so untrusted clients cannot spoof X-Forwarded-* by hitting the API directly.
      ForwardedHeaders__TrustPrivateNetworkProxies: "true"
      Database__ApplyMigrationsOnStartup: ${Database__ApplyMigrationsOnStartup:-true}
      DEPLOY_GIT_SHA: ${DEPLOY_GIT_SHA:-UNSET}
    # No host `ports:` for API — edge is proxy only (prevents Forwarded Headers spoofing).
    # Debug publish (optional): uncomment for local troubleshooting on loopback only.
    # ports:
    #   - "127.0.0.1:${API_HOST_PORT:-5080}:8080"
    networks:
      - smartsecurity_stg
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/health/live >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  proxy:
    image: caddy:2.8-alpine
    container_name: smartsecurity-stg-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROXY_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${PROXY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - smartsecurity_stg_caddy_data:/data
      - smartsecurity_stg_caddy_config:/config
    networks:
      - smartsecurity_stg

  # Optional MQTT lab broker (API MQTT workers remain disabled).
  # Enable with: docker compose --profile mqtt ...
  mosquitto:
    profiles: ["mqtt"]
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    container_name: smartsecurity-stg-mosquitto
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /mosquitto/config /mosquitto/certs /mosquitto/data
        cp /ro/config/mosquitto.conf /mosquitto/config/mosquitto.conf
        cp /ro/config/acl /mosquitto/config/acl
        cp /ro/config/passwd /mosquitto/config/passwd
        cp /ro/certs/ca.crt /mosquitto/certs/ca.crt
        cp /ro/certs/server.crt /mosquitto/certs/server.crt
        cp /ro/certs/server.key /mosquitto/certs/server.key
        chown -R mosquitto:mosquitto /mosquitto/config /mosquitto/certs /mosquitto/data
        chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl
        chmod 600 /mosquitto/certs/server.key
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    user: "0:0"
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1884}:1883"
      - "127.0.0.1:${MQTT_TLS_HOST_PORT:-8884}:8883"
    volumes:
      - ../mosquitto/mosquitto.conf:/ro/config/mosquitto.conf:ro
      - ../mosquitto/acl:/ro/config/acl:ro
      - ../mosquitto/passwd:/ro/config/passwd:ro
      - ../tls/server/ca.crt:/ro/certs/ca.crt:ro
      - ../tls/server/server.crt:/ro/certs/server.crt:ro
      - ../tls/server/server.key:/ro/certs/server.key:ro
      - smartsecurity_stg_mosquitto_data:/mosquitto/data
    environment:
      MQTT_SRV_PASSWORD: ${MQTT_SRV_PASSWORD:-}
    networks:
      - smartsecurity_stg

networks:
  smartsecurity_stg:
    name: smartsecurity_stg
    driver: bridge

volumes:
  smartsecurity_stg_pgdata:
    name: smartsecurity_stg_pgdata
  smartsecurity_stg_caddy_data:
    name: smartsecurity_stg_caddy_data
  smartsecurity_stg_caddy_config:
    name: smartsecurity_stg_caddy_config
  smartsecurity_stg_mosquitto_data:
    name: smartsecurity_stg_mosquitto_data
